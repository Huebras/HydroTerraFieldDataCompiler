name: Build HydroTerra Field Data Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore HydroTerraFieldDataCompiler.sln

      - name: Build Release
        run: dotnet build HydroTerraFieldDataCompiler.sln --configuration Release --no-restore