name: Build HydroTerra Field Data Compiler

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore HydroTerraFieldDataCompiler.sln

      - name: Build
        run: dotnet build HydroTerraFieldDataCompiler.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish HydroTerraFieldDataCompiler.sln --configuration Release --output publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HydroTerraFieldDataCompiler
          path: publish